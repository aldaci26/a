<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#09090b"/>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Decorative subtle outer glow circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.2"/>
  <!-- Main Book Icon -->
  <g filter="url(#glow)">
    <!-- Book Spine & Pages -->
    <path d="M120 370 V150 C120 130 140 120 170 120 H372 C382 120 392 130 392 140 V360 C392 370 382 380 372 380 H160 C135 380 120 376 120 370 Z" fill="#18181b" stroke="url(#goldGrad)" stroke-width="12"/>
    <!-- Page layers -->
    <path d="M160 380 C180 365 220 360 256 360 C292 360 332 365 372 380" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M170 180 H342" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" stroke-opacity="0.9"/>
    <path d="M170 230 H320" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M170 280 H280" stroke="#d97706" stroke-width="8" stroke-linecap="round" stroke-opacity="0.5"/>
    <!-- Bookmark Ribbon -->
    <path d="M310 120 V250 L335 230 L360 250 V120 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
